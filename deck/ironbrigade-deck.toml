# Iron Brigade (ReXGlue port) on the Steam Deck, under Proton, with ReXNative's native D3D12
# renderer. install.sh copies it beside ironbrigade.exe as ironbrigade.toml; read at every
# start; a command line option (`--section.name=value`) overrides a setting for that session.

# Window: the Deck's 1280x800 panel, full screen; the game's 16:9 picture with bars above and
# below. The video mode the game is told about stays the console's 1280x720.
[ui]
window_width = 1280
window_height = 800
fullscreen = true
resolution = "720p"

# The full game's license (XBLA titles check it; 0 runs the trial).
[kernel]
license_mask = 1

# Textures: the Xenos driver's anisotropic filtering (when it draws, F9).
[gpu]
anisotropic_override = 5

# ReXNative draws and presents the game (no EDRAM emulation, each draw once); the Xenos driver
# only runs the GPU's fences and interrupts. The static scenery's recorded command buffers are
# replayed (the layer's default, cmdbuf = 2). The settings menu: F1, or Back+Start on the pad
# (ReXNative's HUD); its changes are saved here.
[rexnative]
enabled = true
# Anisotropic filtering of the native renderer (the ground is seen at grazing angles).
anisotropy = 8
